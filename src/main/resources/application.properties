quarkus.application.name=2026-exemplar
quarkus.http.host=127.0.0.1
quarkus.http.test-port=0
quarkus.http.limits.max-body-size=12M
quarkus.http.limits.max-form-attribute-size=12M
quarkus.http.body.delete-uploaded-files-on-end=true
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h %m %U %s %D
quarkus.http.record-request-start-time=true
quarkus.swagger-ui.always-include=false
quarkus.smallrye-openapi.info-title=Artifact Store Exemplar
quarkus.smallrye-openapi.info-version=1
quarkus.smallrye-openapi.info-description=Java 25 reference API for S3 content and DynamoDB metadata. No authentication.
quarkus.log.console.json.enabled=true
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
quarkus.otel.sdk.disabled=true

# Production requires explicit resource names. Credentials use the SDK provider chain.
artifact.storage.bucket=${ARTIFACT_BUCKET}
artifact.storage.table=${ARTIFACT_TABLE}
quarkus.s3.sync-client.type=url
quarkus.dynamodb.sync-client.type=url
quarkus.dynamodb.interceptors=dev.exemplar.artifact.aws.AttemptTrackingInterceptor
quarkus.s3.api-call-timeout=10S
quarkus.s3.api-call-attempt-timeout=3S
quarkus.dynamodb.api-call-timeout=10S
quarkus.dynamodb.api-call-attempt-timeout=3S
quarkus.s3.sync-client.connection-timeout=2S
quarkus.s3.sync-client.socket-timeout=3S
quarkus.dynamodb.sync-client.connection-timeout=2S
quarkus.dynamodb.sync-client.socket-timeout=3S

# Explicit emulator selection: no AWS account or emulator subscription is needed.
quarkus.aws.devservices.provider=localstack
quarkus.aws.devservices.localstack.image-name=localstack/localstack:4.13
%dev.artifact.storage.bucket=exemplar-artifacts
%dev.artifact.storage.table=exemplar-artifacts
%test.artifact.storage.bucket=exemplar-artifacts-test
%test.artifact.storage.table=exemplar-artifacts-test
%dev.quarkus.s3.devservices.buckets=${artifact.storage.bucket}
%test.quarkus.s3.devservices.buckets=${artifact.storage.bucket}
%dev.quarkus.s3.path-style-access=true
%test.quarkus.s3.path-style-access=true
%dev.quarkus.s3.aws.region=us-east-1
%test.quarkus.s3.aws.region=us-east-1
%dev.quarkus.dynamodb.aws.region=us-east-1
%test.quarkus.dynamodb.aws.region=us-east-1

# Dummy credentials are profile-scoped and override ambient credentials in dev/test.
%dev.quarkus.s3.aws.credentials.type=static
%test.quarkus.s3.aws.credentials.type=static
%dev.quarkus.s3.aws.credentials.static-provider.access-key-id=test
%test.quarkus.s3.aws.credentials.static-provider.access-key-id=test
%dev.quarkus.s3.aws.credentials.static-provider.secret-access-key=test
%test.quarkus.s3.aws.credentials.static-provider.secret-access-key=test
%dev.quarkus.dynamodb.aws.credentials.type=static
%test.quarkus.dynamodb.aws.credentials.type=static
%dev.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=test
%test.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=test
%dev.quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=test
%test.quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=test
