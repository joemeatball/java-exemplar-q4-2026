name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.1.0 (without v)'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    name: Verify and package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: '3'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Validate version and reject existing tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/release-preflight.sh
      - run: python3 scripts/check-dependency-baseline.py
      - uses: ./.github/actions/setup
      - name: Verify and package the release version
        run: ./gradlew --no-daemon --console=plain -PreleaseVersion="$RELEASE_VERSION" verifyAll releaseChecksums
      - name: Check distribution contents
        run: python3 scripts/check-distribution.py "build/distributions/2026-exemplar-$RELEASE_VERSION.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: build/distributions/
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: assets
      - name: Publish verified assets
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          sha256sum --check SHA256SUMS
          cd ..
          gh release create "v$RELEASE_VERSION" --target "$GITHUB_SHA" --draft \
            --title "v$RELEASE_VERSION" --generate-notes \
            assets/*.zip assets/SHA256SUMS assets/*.cdx.json
          gh release edit "v$RELEASE_VERSION" --draft=false
