name: Refresh dependency baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    name: Generate candidate locks and checksums
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Resolve and verify candidate baseline
        run: bash scripts/refresh-dependencies.sh
      - name: Upload candidate for review (never commits automatically)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-baseline-candidate
          path: |
            gradle.lockfile
            gradle/verification-metadata.xml
            build/reports/
            build/test-results/
          if-no-files-found: error
